<div class="quotation-modal">
  <div class="modal-header">
    <div class="modal-header-icon">
      <nz-icon nzType="file-text" />
    </div>
    <div>
      <h3 class="modal-title">Yêu cầu báo giá</h3>
      <p class="modal-subtitle">{{ modalData.productName }}</p>
    </div>
  </div>

  <form nz-form [formGroup]="form" nzLayout="vertical" class="quotation-form">
    <div nz-row [nzGutter]="16">
      <div nz-col [nzSpan]="12">
        <nz-form-item>
          <nz-form-label nzRequired>Họ và tên</nz-form-label>
          <nz-form-control nzErrorTip="Vui lòng nhập họ và tên">
            <nz-input-group nzPrefixIcon="user">
              <input nz-input formControlName="customerName" placeholder="Nguyễn Văn A" />
            </nz-input-group>
          </nz-form-control>
        </nz-form-item>
      </div>
      <div nz-col [nzSpan]="12">
        <nz-form-item>
          <nz-form-label nzRequired>Số điện thoại</nz-form-label>
          <nz-form-control nzErrorTip="Số điện thoại phải có 10-11 chữ số">
            <nz-input-group nzPrefixIcon="phone">
              <input nz-input formControlName="customerPhone" placeholder="0901234567" />
            </nz-input-group>
          </nz-form-control>
        </nz-form-item>
      </div>
    </div>

    <div nz-row [nzGutter]="16">
      <div nz-col [nzSpan]="12">
        <nz-form-item>
          <nz-form-label nzRequired>Email</nz-form-label>
          <nz-form-control nzErrorTip="Vui lòng nhập email hợp lệ">
            <nz-input-group nzPrefixIcon="mail">
              <input nz-input formControlName="customerEmail" placeholder="example@email.com" />
            </nz-input-group>
          </nz-form-control>
        </nz-form-item>
      </div>
      <div nz-col [nzSpan]="12">
        <nz-form-item>
          <nz-form-label>Tên công ty</nz-form-label>
          <nz-form-control>
            <nz-input-group nzPrefixIcon="bank">
              <input nz-input formControlName="companyName" placeholder="Công ty TNHH..." />
            </nz-input-group>
          </nz-form-control>
        </nz-form-item>
      </div>
    </div>

    <nz-form-item>
      <nz-form-label nzRequired>Số lượng cần báo giá</nz-form-label>
      <nz-form-control nzErrorTip="Số lượng tối thiểu là 1">
        <nz-input-number
          formControlName="quantity"
          [nzMin]="1"
          [nzStep]="1"
          class="qty-input"
        />
      </nz-form-control>
    </nz-form-item>

    <nz-form-item>
      <nz-form-label>Ghi chú / Yêu cầu thêm</nz-form-label>
      <nz-form-control nzErrorTip="Tối đa 500 ký tự">
        <textarea
          nz-input
          formControlName="note"
          [nzAutosize]="{ minRows: 3, maxRows: 5 }"
          placeholder="Nhập yêu cầu đặc biệt, số lượng theo giai đoạn, thời gian cần hàng..."
        ></textarea>
      </nz-form-control>
    </nz-form-item>

    <div class="form-actions">
      <button nz-button nzType="default" (click)="cancel()" [disabled]="isSubmitting">
        Hủy
      </button>
      <button
        nz-button
        nzType="primary"
        class="submit-btn"
        (click)="submit()"
        [nzLoading]="isSubmitting"
      >
        <nz-icon nzType="send" *ngIf="!isSubmitting" />
        Gửi yêu cầu báo giá
      </button>
    </div>
  </form>
</div>
