<div class="admin-categories-container">
  <div class="header-action">
    <h2 class="title">Quản lý Danh mục sản phẩm</h2>
    <button nz-button nzType="primary" (click)="showAddModal()" class="add-btn">
      <nz-icon nzType="plus" /> Thêm danh mục mới
    </button>
  </div>

  <app-loading [isLoading]="loading">
    <!-- Desktop View Table -->
    <div class="admin-categories-desktop-view">
      <div class="table-card">
        <nz-table
          #basicTable
          [nzData]="filteredCategories"
          [nzFrontPagination]="false"
          [nzShowPagination]="false"
          [nzScroll]="{ x: '200px'}"
        >
          <thead>
            <tr>
              <th class="flex-center-all" nzWidth="50px">ID</th>
              <th nzWidth="300px">Tên danh mục</th>
              <th class="flex-center-all" nzWidth="150px">Số lượng SP</th>
              <th class="flex-center-all" nzWidth="100px">Thao tác</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let data of basicTable.data">
              <td class="flex-center-all">{{ data.id }}</td>
              <td>
                <div
                  class="category-name-cell"
                  [style.padding-left]="'calc(' + data.level + ' * var(--indent-unit))'"
                >
                  <!-- Expand/Collapse toggle for parents -->
                  <span
                    *ngIf="data.children && data.children.length > 0"
                    class="expand-trigger"
                    (click)="data.expand = !data.expand"
                  >
                    <nz-icon
                      [nzType]="data.expand ? 'down' : 'right'"
                      class="tree-icon"
                    />
                  </span>
  
                  <!-- Indent icon for children without their own children -->
                  <span
                    *ngIf="
                      (!data.children || data.children.length === 0) &&
                      data.level > 0
                    "
                    class="sub-node-icon"
                  >
                    <nz-icon
                      nzType="enter"
                      [class.grandchild-icon]="data.level > 1"
                    />
                  </span>
  
                  <span
                    [class.parent-cat]="data.level === 0"
                    [class.grandchild-cat]="data.level > 1"
                  >
                    {{ data.name }}
                  </span>
                </div>
              </td>
              <td class="flex-center-all">
                <span
                  class="product-count-badge"
                  *ngIf="data.totalProductCount != null"
                >
                  {{ data.totalProductCount }} sản phẩm
                </span>
              </td>
              <td class="flex-center-all">
                <div class="action-buttons">
                  <button
                    nz-button
                    nzType="text"
                    (click)="showEditModal(data)"
                    nz-tooltip
                    nzTooltipTitle="Chỉnh sửa"
                  >
                    <nz-icon nzType="edit" class="edit-icon" />
                  </button>
                  <button
                    nz-button
                    nzType="text"
                    nzDanger
                    (click)="deleteCategory(data.id)"
                    nz-tooltip
                    nzTooltipTitle="Xóa"
                    [nzLoading]="isDeleteCategory[data.id]"
                  >
                    <nz-icon nzType="delete" />
                  </button>
                </div>
              </td>
            </tr>
          </tbody>
        </nz-table>
      </div>
    </div>

    <!-- Mobile View Cards -->
    <div class="admin-categories-mobile-view">
      <div *ngFor="let data of filteredCategories" class="category-mobile-card" [style.margin-left]="'calc(' + data.level + ' * 12px)'">
        <div class="card-content">
          <div class="category-info">
            <div class="category-main">
              <span
                *ngIf="data.children && data.children.length > 0"
                class="expand-trigger-mob"
                (click)="data.expand = !data.expand"
              >
                <nz-icon
                  [nzType]="data.expand ? 'down' : 'right'"
                  class="tree-icon-mob"
                />
              </span>
              <span class="category-id">#{{ data.id }}</span>
              <span class="category-name" [class.parent-name]="data.level === 0" (click)="data.children && data.children.length > 0 ? data.expand = !data.expand : null">{{ data.name }}</span>
            </div>
            <nz-tag class="product-count-tag" *ngIf="data.totalProductCount != null">
              {{ data.totalProductCount }} SP
            </nz-tag>
          </div>
          
          <div class="category-actions">
            <button nz-button nzType="text" (click)="showEditModal(data)" class="action-btn edit">
              <nz-icon nzType="edit" />
            </button>
            <button nz-button nzType="text" nzDanger (click)="deleteCategory(data.id)" [nzLoading]="isDeleteCategory[data.id]" class="action-btn delete">
              <nz-icon nzType="delete" />
            </button>
          </div>
        </div>
      </div>
    </div>
  </app-loading>

  <!-- Modal Thêm/Sửa -->
  <nz-modal
    [(nzVisible)]="isModalVisible"
    [nzTitle]="isEditMode ? 'Chỉnh sửa danh mục' : 'Tạo danh mục mới'"
    (nzOnCancel)="handleCancel()"
    (nzOnOk)="handleOk()"
    [nzOkText]="isEditMode ? 'Cập nhật' : 'Tạo mới'"
    [nzCancelText]="'Hủy'"
    [nzOkLoading]="isLoadingModal"
  >
    <div *nzModalContent>
      <form nz-form [formGroup]="categoryForm" nzLayout="vertical">
        <nz-form-item>
          <nz-form-label nzRequired>Tên danh mục</nz-form-label>
          <nz-form-control nzErrorTip="Vui lòng nhập tên danh mục">
            <input
              nz-input
              formControlName="name"
              placeholder="Ví dụ: Dao Phay (End Mill)"
            />
          </nz-form-control>
        </nz-form-item>

        <nz-form-item>
          <nz-form-label>Danh mục cha</nz-form-label>
          <nz-form-control>
            <nz-select
              formControlName="parentId"
              nzAllowClear
              nzPlaceHolder="Chọn danh mục cha (để trống nếu là danh mục gốc)"
            >
              <nz-option
                *ngFor="let opt of parentOptions"
                [nzValue]="opt.id"
                [nzLabel]="opt.displayName"
              ></nz-option>
            </nz-select>
          </nz-form-control>
        </nz-form-item>
      </form>
    </div>
  </nz-modal>
</div>
