<div class="register-container">
  <button
    nz-button
    class="back-button"
    nzType="default"
    nzShape="circle"
    routerLink="/"
  >
    <nz-icon nzType="arrow-left" />
  </button>
  
  <div class="register-box">
    <div class="brand-logo-container">
      <img src="Logo.ico" alt="Logo" class="auth-logo" />
      <div class="brand-text">
        <span class="text-primary">Tool</span><span class="text-danger">CNC</span>
      </div>
    </div>

    <div class="register-header">
      <h2>Đăng ký Tài khoản</h2>
      <p>Điền thông tin của bạn để tạo tài khoản mới</p>
    </div>

    <form
      nz-form
      [formGroup]="registerForm"
      class="register-form"
      (ngSubmit)="submitForm()"
    >
      <app-custom-input
        formControlName="username"
        placeholder="Tên đăng nhập (tối thiểu 4 ký tự)"
        prefixIcon="user"
        errorTip="Vui lòng nhập tên đăng nhập dài hơn 4 ký tự!"
        class="register-form-margin"
      ></app-custom-input>

      <app-custom-input
        formControlName="email"
        type="email"
        placeholder="Email (example@gmail.com)"
        prefixIcon="mail"
        errorTip="Vui lòng nhập Email hợp lệ!"
        class="register-form-margin"
      ></app-custom-input>

      <app-custom-input
        formControlName="password"
        type="password"
        placeholder="Mật khẩu (tối thiểu 6 ký tự)"
        prefixIcon="lock"
        errorTip="Vui lòng nhập mật khẩu dài hơn 6 ký tự!"
        (ngModelChange)="updateConfirmValidator()"
        class="register-form-margin"
      ></app-custom-input>

      <app-custom-input
        formControlName="confirmPassword"
        type="password"
        placeholder="Xác nhận mật khẩu"
        prefixIcon="lock"
        [errorTip]="confirmPasswordError"
        class="register-form-margin"
      ></app-custom-input>

      <button
        nz-button
        class="register-form-button register-form-margin"
        [nzType]="'primary'"
        [nzLoading]="isLoading"
        nzBlock
      >
        Tạo tài khoản
      </button>

      <div class="register-footer">
        Đã có tài khoản? <a routerLink="/login">Đăng nhập ngay</a>
      </div>
    </form>
  </div>
</div>
